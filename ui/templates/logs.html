{% extends "base.html" %}

{% block title %}تاریخچه و لاگ‌های اتوماسیون{% endblock %}
{% block route %}logs{% endblock %}

{% block content %}
<div class="space-y-6" x-data="{
    logs: [],
    total: 0,
    limit: 15,
    offset: 0,
    loading: true,
    selectedWf: '',
    selectedStatus: '',
    workflows: [],
    
    init() {
        // Fetch real workflows list for filter
        fetch('/api/workflows')
            .then(r => r.json())
            .then(data => this.workflows = data);
        this.fetchLogs();
    },
    
    fetchLogs() {
        this.loading = true;
        let url = `/api/logs?limit=${this.limit}&offset=${this.offset}`;
        if (this.selectedWf) url += `&workflow=${this.selectedWf}`;
        if (this.selectedStatus) url += `&status=${this.selectedStatus}`;
        
        fetch(url)
            .then(r => r.json())
            .then(data => {
                this.logs = data.logs;
                this.total = data.total;
                this.loading = false;
            })
            .catch(e => console.error(e));
    },
    
    clearAll() {
        if (!confirm('آیا از پاکسازی تمام تاریخچه لاگ‌ها مطمئن هستید؟ این عمل غیرقابل بازگشت است.')) return;
        fetch('/api/logs', { method: 'DELETE' })
            .then(r => r.json())
            .then(() => {
                Alpine.store('globalStore').showToast('کل تاریخچه لاگ‌ها با موفقیت پاکسازی شد', 'success');
                this.offset = 0;
                this.fetchLogs();
            })
            .catch(e => console.error(e));
    },
    
    prevPage() {
        if (this.offset > 0) {
            this.offset = Math.max(0, this.offset - this.limit);
            this.fetchLogs();
        }
    },
    
    nextPage() {
        if (this.offset + this.limit < this.total) {
            this.offset += this.limit;
            this.fetchLogs();
        }
    },
    
    applyFilters() {
        this.offset = 0;
        this.fetchLogs();
    }
}">
    
    <!-- Controls/Filters Header -->
    <div class="card p-4 flex flex-wrap gap-4 items-center justify-between bg-zinc-50/50 dark:bg-zinc-900/10">
        <div class="flex flex-wrap gap-3 items-center">
            <!-- Workflow Filter -->
            <select x-model="selectedWf" @change="applyFilters()" class="border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 rounded py-1.5 px-3 focus:ring-1 focus:ring-zinc-400 focus:border-zinc-400 text-xs text-zinc-700 dark:text-zinc-300">
                <option value="">همه فرآیندها</option>
                <template x-for="wf in workflows" :key="wf.name">
                    <option :value="wf.name" x-text="wf.description || wf.name"></option>
                </template>
            </select>
            
            <!-- Status Filter -->
            <select x-model="selectedStatus" @change="applyFilters()" class="border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 rounded py-1.5 px-3 focus:ring-1 focus:ring-zinc-400 focus:border-zinc-400 text-xs text-zinc-700 dark:text-zinc-300">
                <option value="">همه وضعیت‌ها</option>
                <option value="INFO">INFO</option>
                <option value="WARN">WARNING</option>
                <option value="ERROR">ERROR</option>
                <option value="SUCCESS">SUCCESS</option>
            </select>
        </div>
        
        <button @click="clearAll()" class="btn btn-outline border-red-200 text-red-600 hover:bg-red-50 dark:border-red-950 dark:text-red-400 dark:hover:bg-red-950/20 text-xs px-3 py-1.5">
            <svg class="w-3.5 h-3.5 ml-1.5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            پاکسازی لاگ‌ها
        </button>
    </div>

    <!-- Logs Table -->
    <div class="card overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-150 dark:divide-zinc-800/80">
                <thead class="bg-zinc-50 dark:bg-zinc-900/30">
                    <tr class="text-xs text-zinc-500 dark:text-zinc-400">
                        <th scope="col" class="px-6 py-3.5 text-right font-medium tracking-wider w-24">زمان</th>
                        <th scope="col" class="px-6 py-3.5 text-right font-medium tracking-wider w-24">وضعیت</th>
                        <th scope="col" class="px-6 py-3.5 text-right font-medium tracking-wider w-36">فرآیند</th>
                        <th scope="col" class="px-6 py-3.5 text-right font-medium tracking-wider w-36">مرحله فنی</th>
                        <th scope="col" class="px-6 py-3.5 text-right font-medium tracking-wider">شرح رویداد</th>
                        <th scope="col" class="px-6 py-3.5 text-center font-medium tracking-wider w-20">مدیا</th>
                    </tr>
                </thead>
                <tbody class="bg-white dark:bg-zinc-950 divide-y divide-gray-100 dark:divide-zinc-800/40 text-xs">
                    <!-- Loading skeleton -->
                    <template x-if="loading">
                        <template x-for="i in [1, 2, 3, 4, 5]">
                            <tr class="animate-pulse">
                                <td colspan="6" class="px-6 py-4"><div class="h-4 bg-zinc-100 dark:bg-zinc-900 rounded w-full"></div></td>
                            </tr>
                        </template>
                    </template>
                    
                    <!-- Empty State -->
                    <template x-if="!loading && logs.length === 0">
                        <tr>
                            <td colspan="6" class="px-6 py-12 text-center text-zinc-400 dark:text-zinc-500">
                                <svg class="w-8 h-8 mx-auto mb-2 text-zinc-300 dark:text-zinc-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"></path></svg>
                                لاگی در سیستم ثبت نشده است.
                            </td>
                        </tr>
                    </template>

                    <!-- Real Rows -->
                    <template x-if="!loading && logs.length > 0">
                        <template x-for="log in logs" :key="log.id">
                            <tr class="hover:bg-zinc-50/50 dark:hover:bg-zinc-900/10 transition-colors">
                                <td class="px-6 py-3 whitespace-nowrap text-zinc-400 font-mono text-[10px]" x-text="new Date(log.created_at).toLocaleTimeString('fa-IR', {hour12:false})"></td>
                                <td class="px-6 py-3 whitespace-nowrap">
                                    <span class="badge text-[10px] py-0 px-1.5" :class="{
                                        'badge-error': log.status === 'ERROR',
                                        'badge-warning': log.status === 'WARN',
                                        'badge-success': ['INFO', 'SUCCESS'].includes(log.status)
                                    }" x-text="log.status"></span>
                                </td>
                                <td class="px-6 py-3 whitespace-nowrap font-medium text-zinc-800 dark:text-zinc-200" x-text="log.workflow_name || '-'"></td>
                                <td class="px-6 py-3 whitespace-nowrap text-zinc-500 font-mono text-[10px]" x-text="log.step_name || '-'"></td>
                                <td class="px-6 py-3 text-zinc-600 dark:text-zinc-400 break-all select-text font-normal" x-text="log.message"></td>
                                <td class="px-6 py-3 whitespace-nowrap text-center">
                                    <template x-if="log.screenshot_path">
                                        <a :href="'/api/logs/' + log.id + '/screenshot'" target="_blank" class="text-zinc-800 hover:text-black dark:text-zinc-200 dark:hover:text-white inline-flex p-1 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded transition-colors" title="مشاهده اسکرین‌شات">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                        </a>
                                    </template>
                                    <template x-if="!log.screenshot_path">
                                        <span class="text-zinc-300 dark:text-zinc-700 select-none">-</span>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </template>
                </tbody>
            </table>
        </div>
        
        <!-- Pagination Controls -->
        <div class="px-6 py-3.5 bg-zinc-50 dark:bg-zinc-900/30 flex items-center justify-between border-t border-gray-150 dark:border-zinc-800/80">
            <div class="flex-1 flex justify-between sm:hidden">
                <button @click="prevPage()" :disabled="offset === 0" class="btn btn-outline text-xs px-3 py-1.5 disabled:opacity-40">قبلی</button>
                <button @click="nextPage()" :disabled="offset + limit >= total" class="btn btn-outline text-xs px-3 py-1.5 disabled:opacity-40">بعدی</button>
            </div>
            <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between text-xs text-zinc-500">
                <div>
                    <p>
                        نمایش <span class="font-medium text-zinc-700 dark:text-zinc-300" x-text="logs.length > 0 ? offset + 1 : 0"></span> تا 
                        <span class="font-medium text-zinc-700 dark:text-zinc-300" x-text="offset + logs.length"></span> از 
                        <span class="font-medium text-zinc-700 dark:text-zinc-300" x-text="total"></span> ردیف لاگ
                    </p>
                </div>
                <div class="flex gap-2">
                    <button @click="prevPage()" :disabled="offset === 0" class="btn btn-outline text-[11px] py-1 px-3 disabled:opacity-40 select-none">
                        قبلی
                    </button>
                    <button @click="nextPage()" :disabled="offset + limit >= total" class="btn btn-outline text-[11px] py-1 px-3 disabled:opacity-40 select-none">
                        بعدی
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
