{% extends "base.html" %}

{% block title %}تاریخچه و لاگ‌های اتوماسیون{% endblock %}
{% block route %}logs{% endblock %}

{% block content %}
<div class="h-[calc(100vh-120px)] overflow-hidden" x-data="{
    sessions: [],
    selectedSessionId: null,
    selectedSession: null,
    logs: [],
    screenshotLogs: [],
    currentPhotoIndex: 0,
    loading: true,
    showArrows: true,
    arrowTimer: null,
    
    async init() {
        await this.fetchSessions();
        
        // Listen to live logs from WebSocket
        window.addEventListener('new-log', async (e) => {
            const newLog = e.detail;
            
            // Check if this is a new session that we don't have yet
            const sessionExists = this.sessions.some(s => s.session_id === newLog.session_id);
            if (!sessionExists && newLog.session_id && newLog.session_id !== 'system') {
                await this.fetchSessions();
            }
            
            // If the new log belongs to the selected session, append it
            if (newLog.session_id === this.selectedSessionId) {
                // Check if already in logs to prevent duplicates
                if (!this.logs.some(l => l.id === newLog.id)) {
                    this.logs.push(newLog);
                    if (newLog.screenshot_path) {
                        this.screenshotLogs.push(newLog);
                        // Auto go to last screenshot if we are watching live
                        if (this.currentPhotoIndex === this.screenshotLogs.length - 2) {
                            this.currentPhotoIndex = this.screenshotLogs.length - 1;
                        }
                    }
                }
                
                // Update final_status if session finished
                if (newLog.status === 'success' && newLog.step_name === 'workflow_done') {
                    if (this.selectedSession) this.selectedSession.final_status = 'success';
                    const s = this.sessions.find(x => x.session_id === this.selectedSessionId);
                    if (s) s.final_status = 'success';
                } else if (newLog.status === 'error') {
                    if (this.selectedSession) this.selectedSession.final_status = 'error';
                    const s = this.sessions.find(x => x.session_id === this.selectedSessionId);
                    if (s) s.final_status = 'error';
                }
            }
        });
    },
    
    async fetchSessions() {
        this.loading = true;
        try {
            const r = await fetch('/api/sessions?limit=100');
            const data = await r.json();
            this.sessions = data.sessions || [];
        } catch (e) {
            console.error('Error fetching sessions:', e);
        } finally {
            this.loading = false;
        }
    },
    
    async selectSession(session) {
        this.selectedSessionId = session.session_id;
        this.selectedSession = session;
        this.loading = true;
        this.currentPhotoIndex = 0;
        this.screenshotLogs = [];
        this.logs = [];
        
        try {
            const url = `/api/session/${session.session_id}/logs?limit=500`;
            const r = await fetch(url);
            const data = await r.json();
            this.logs = data.logs || [];
            this.screenshotLogs = this.logs.filter(log => log.screenshot_path);
        } catch (e) {
            console.error('Error fetching session logs:', e);
        } finally {
            this.loading = false;
        }
    },

    goBack() {
        this.selectedSessionId = null;
        this.selectedSession = null;
    },
    
    async clearAll() {
        if (!confirm('آیا از پاکسازی تمام تاریخچه لاگ‌ها مطمئن هستید؟ این عمل غیرقابل بازگشت است.')) return;
        try {
            await fetch('/api/logs', { method: 'DELETE' });
            Alpine.store('globalStore').showToast('کل تاریخچه لاگ‌ها با موفقیت پاکسازی شد', 'success');
            this.sessions = [];
            this.selectedSessionId = null;
            this.selectedSession = null;
            this.logs = [];
            this.screenshotLogs = [];
            this.currentPhotoIndex = 0;
        } catch(e) {
            console.error(e);
        }
    },
    
    prevPhoto() {
        if (this.currentPhotoIndex > 0) {
            this.currentPhotoIndex--;
        }
    },
    
    nextPhoto() {
        if (this.currentPhotoIndex < this.screenshotLogs.length - 1) {
            this.currentPhotoIndex++;
        }
    },
    
    get currentLog() {
        return this.screenshotLogs[this.currentPhotoIndex] || null;
    },
    
    get isLastPhoto() {
        return this.screenshotLogs.length > 0 && this.currentPhotoIndex === this.screenshotLogs.length - 1;
    },
    
    formatTime(dtStr) {
        if (!dtStr) return '';
        try {
            const dt = new Date(dtStr);
            return dt.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' ' + dt.toLocaleDateString('fa-IR');
        } catch (e) {
            return dtStr;
        }
    },
    
    handleKeydown(e) {
        if (!this.selectedSessionId) return;
        if (e.key === 'ArrowLeft') {
            this.nextPhoto();
        } else if (e.key === 'ArrowRight') {
            this.prevPhoto();
        }
    },

    onMouseMove() {
        this.showArrows = true;
        clearTimeout(this.arrowTimer);
        this.arrowTimer = setTimeout(() => {
            this.showArrows = false;
        }, 1500);
    },

    toggleFullScreen() {
        const elem = document.getElementById('image-gallery-container');
        if (!document.fullscreenElement) {
            elem.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable fullscreen: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }
}" @keydown.window="handleKeydown($event)">

    <!-- ================= VIEW 1: SESSIONS FOLDER (GRID) ================= -->
    <template x-if="!selectedSessionId">
        <div class="h-full flex flex-col fade-in">
            <!-- Header -->
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-white dark:bg-zinc-900 border border-gray-100 dark:border-zinc-800 flex items-center justify-center shadow-sm">
                        <svg class="w-5 h-5 text-zinc-700 dark:text-zinc-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-zinc-900 dark:text-zinc-100">پوشه جلسات</h2>
                        <p class="text-xs text-zinc-500 dark:text-zinc-400">تاریخچه اجراهای قبلی را انتخاب و مشاهده کنید.</p>
                    </div>
                </div>
                <button @click="clearAll()" class="btn btn-outline border-red-200 text-red-600 hover:bg-red-50 dark:border-red-900/30 dark:hover:bg-red-900/20 text-sm px-4 py-2">
                    <svg class="w-4 h-4 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    پاکسازی همه
                </button>
            </div>

            <!-- Grid -->
            <div class="flex-1 overflow-y-auto scrollbar pb-6">
                <template x-if="loading">
                    <div class="flex justify-center items-center h-40">
                        <svg class="w-8 h-8 text-zinc-300 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </div>
                </template>
                
                <template x-if="!loading && sessions.length === 0">
                    <div class="flex flex-col items-center justify-center h-64 text-center bg-zinc-50/50 dark:bg-zinc-900/10 border border-dashed border-gray-200 dark:border-zinc-800 rounded-2xl">
                        <svg class="w-12 h-12 text-zinc-300 dark:text-zinc-700 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400">هیچ جلسه‌ای یافت نشد.</p>
                    </div>
                </template>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4">
                    <template x-for="session in sessions" :key="session.session_id">
                        <div @click="selectSession(session)" class="card p-5 cursor-pointer hover:border-zinc-300 dark:hover:border-zinc-700 hover:shadow-md transition-all duration-200 group flex flex-col justify-between h-32 relative overflow-hidden">
                            <!-- Background Accent -->
                            <div class="absolute top-0 right-0 w-16 h-16 bg-gradient-to-br from-zinc-100 to-transparent dark:from-zinc-800 rounded-bl-[40px] opacity-50 group-hover:opacity-100 transition-opacity"></div>
                            
                            <div class="relative z-10 flex justify-between items-start">
                                <div class="font-bold text-zinc-800 dark:text-zinc-200 truncate pr-2 text-base" x-text="session.workflow_name"></div>
                                <div class="w-2.5 h-2.5 rounded-full shrink-0 shadow-sm"
                                     :class="{
                                         'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]': session.final_status === 'success',
                                         'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)]': session.final_status === 'error',
                                         'bg-yellow-400': !['success', 'error'].includes(session.final_status)
                                     }"></div>
                            </div>
                            <div class="relative z-10 flex items-center justify-between mt-auto pt-4 border-t border-gray-100 dark:border-zinc-800/50">
                                <div class="text-[11px] text-zinc-400 dark:text-zinc-500 font-mono flex items-center gap-1.5">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <span x-text="formatTime(session.started_at)"></span>
                                </div>
                                <div class="w-6 h-6 rounded-full bg-zinc-50 dark:bg-zinc-900 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity transform translate-x-2 group-hover:translate-x-0">
                                    <svg class="w-3.5 h-3.5 text-zinc-600 dark:text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>

    <!-- ================= VIEW 2: SESSION DETAILS & GALLERY ================= -->
    <template x-if="selectedSessionId">
        <div class="h-full flex flex-col fade-in">
            
            <!-- Top Toolbar -->
            <div class="flex items-center justify-between mb-4 pb-4 border-b border-gray-200 dark:border-zinc-800 shrink-0">
                <div class="flex items-center gap-4">
                    <button @click="goBack()" class="p-2 rounded-xl bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-colors shadow-sm text-zinc-600 dark:text-zinc-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                    <div>
                        <h2 class="text-xl font-black text-zinc-900 dark:text-zinc-100 flex items-center gap-2">
                            <span x-text="selectedSession.workflow_name"></span>
                            <span class="px-2 py-0.5 rounded text-[10px] uppercase font-bold"
                                  :class="{'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400': selectedSession.final_status === 'success',
                                           'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400': selectedSession.final_status === 'error',
                                           'bg-zinc-100 text-zinc-600 dark:bg-zinc-800 dark:text-zinc-400': !['success', 'error'].includes(selectedSession.final_status)}"
                                  x-text="selectedSession.final_status || 'RUNNING'"></span>
                        </h2>
                        <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5" x-text="'شروع: ' + formatTime(selectedSession.started_at)"></p>
                    </div>
                </div>
            </div>

            <!-- Content Area: Gallery (Top) and Logs (Bottom) -->
            <div class="flex-1 overflow-hidden flex flex-col gap-6">
                
                <!-- GALLERY SECTION (Top, Centered) -->
                <div class="w-full flex-shrink-0 flex flex-col items-center justify-center bg-zinc-50 dark:bg-zinc-900/20 rounded-2xl border border-gray-200 dark:border-zinc-800 p-6 relative group" 
                     @mousemove="onMouseMove()" @mouseleave="showArrows = false">
                    
                    <template x-if="screenshotLogs.length === 0">
                        <div class="py-16 text-center text-zinc-400 dark:text-zinc-500 flex flex-col items-center">
                            <svg class="w-10 h-10 mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <span class="text-sm">تصویری برای این جلسه ثبت نشده است.</span>
                        </div>
                    </template>

                    <template x-if="screenshotLogs.length > 0">
                        <div class="w-full h-full flex flex-col items-center justify-center max-h-[50vh]">
                            
                            <!-- Image Info Bar -->
                            <div class="absolute top-4 left-6 right-6 flex justify-between items-start z-20 pointer-events-none transition-opacity duration-300" :class="showArrows ? 'opacity-100' : 'opacity-0'">
                                <div class="bg-black/60 backdrop-blur-md text-white px-4 py-2 rounded-lg pointer-events-auto shadow-lg border border-white/10 max-w-md">
                                    <div class="text-sm font-bold truncate" x-text="currentLog.message || currentLog.step_name"></div>
                                    <div class="text-[10px] text-zinc-300 mt-1" x-text="'تصویر ' + (currentPhotoIndex + 1) + ' از ' + screenshotLogs.length + ' • ' + formatTime(currentLog.created_at)"></div>
                                </div>
                                <button @click="toggleFullScreen()" class="bg-black/60 backdrop-blur-md text-white p-2.5 rounded-lg pointer-events-auto hover:bg-black/80 transition-colors border border-white/10 shadow-lg" title="تمام‌صفحه">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                                </button>
                            </div>

                            <!-- Main Image Container with Neon Glow -->
                            <div id="image-gallery-container" 
                                 class="relative w-full h-full flex items-center justify-center rounded-xl overflow-hidden transition-all duration-500 bg-zinc-950"
                                 :class="{
                                     'shadow-[0_0_40px_rgba(34,197,94,0.3),inset_0_0_20px_rgba(34,197,94,0.2)] border-[3px] border-green-400': isLastPhoto && selectedSession.final_status === 'success',
                                     'shadow-[0_0_40px_rgba(239,68,68,0.3),inset_0_0_20px_rgba(239,68,68,0.2)] border-[3px] border-red-500': isLastPhoto && selectedSession.final_status === 'error',
                                     'border-[3px] border-zinc-800': !isLastPhoto || (!selectedSession || !['success', 'error'].includes(selectedSession.final_status))
                                 }">
                                
                                <img :src="'/api/logs/' + currentLog.id + '/screenshot'" 
                                     class="max-w-full max-h-full object-contain transition-opacity duration-300 rounded-lg" 
                                     alt="Screenshot">
                                
                                <!-- Floating Arrows -->
                                <button @click="nextPhoto()" :disabled="currentPhotoIndex === screenshotLogs.length - 1" 
                                        class="absolute left-4 top-1/2 -translate-y-1/2 p-3 rounded-full bg-black/50 hover:bg-black/80 text-white backdrop-blur-sm transition-all duration-300 border border-white/20 disabled:opacity-0 shadow-xl"
                                        :class="showArrows ? 'translate-x-0 opacity-100' : '-translate-x-4 opacity-0 pointer-events-none'">
                                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                                </button>
                                
                                <button @click="prevPhoto()" :disabled="currentPhotoIndex === 0" 
                                        class="absolute right-4 top-1/2 -translate-y-1/2 p-3 rounded-full bg-black/50 hover:bg-black/80 text-white backdrop-blur-sm transition-all duration-300 border border-white/20 disabled:opacity-0 shadow-xl"
                                        :class="showArrows ? 'translate-x-0 opacity-100' : 'translate-x-4 opacity-0 pointer-events-none'">
                                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            </div>
                            
                            <!-- Dot Indicators -->
                            <div class="mt-4 flex gap-1.5 overflow-x-auto max-w-full px-2 scrollbar-hide py-1">
                                <template x-for="(log, idx) in screenshotLogs" :key="idx">
                                    <button @click="currentPhotoIndex = idx" 
                                            class="w-2 h-2 rounded-full transition-all duration-300 shrink-0"
                                            :class="currentPhotoIndex === idx ? 'bg-zinc-800 dark:bg-white w-6' : 'bg-zinc-300 dark:bg-zinc-700 hover:bg-zinc-400 dark:hover:bg-zinc-600'"></button>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- LOGS TABLE (Bottom) -->
                <div class="flex-1 flex flex-col bg-white dark:bg-zinc-950 border border-gray-200 dark:border-zinc-800 rounded-2xl overflow-hidden shadow-sm">
                    <div class="px-5 py-3.5 border-b border-gray-100 dark:border-zinc-800/80 bg-zinc-50/80 dark:bg-zinc-900/40 flex justify-between items-center shrink-0">
                        <h3 class="text-sm font-bold text-zinc-800 dark:text-zinc-200 flex items-center gap-2">
                            <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                            جزئیات لاگ‌های متنی
                        </h3>
                        <span class="text-xs font-mono text-zinc-500 bg-zinc-200/50 dark:bg-zinc-800 px-2 py-0.5 rounded-full" x-text="logs.length + ' لاگ'"></span>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto scrollbar">
                        <table class="min-w-full divide-y divide-gray-100 dark:divide-zinc-800/50">
                            <thead class="bg-white dark:bg-zinc-950 sticky top-0 z-10">
                                <tr class="text-[11px] text-zinc-400 dark:text-zinc-500 uppercase tracking-wider">
                                    <th class="px-5 py-3 text-right font-medium w-24">زمان</th>
                                    <th class="px-5 py-3 text-right font-medium w-24">وضعیت</th>
                                    <th class="px-5 py-3 text-right font-medium w-32">مرحله</th>
                                    <th class="px-5 py-3 text-right font-medium">پیام</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-50 dark:divide-zinc-900/40 text-xs">
                                <template x-if="loading">
                                    <tr><td colspan="4" class="px-5 py-8 text-center text-zinc-400"><svg class="w-6 h-6 animate-spin mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></td></tr>
                                </template>
                                <template x-if="!loading && logs.length === 0">
                                    <tr><td colspan="4" class="px-5 py-8 text-center text-zinc-400">لاگی ثبت نشده است.</td></tr>
                                </template>
                                <template x-if="!loading">
                                    <template x-for="log in logs" :key="log.id">
                                        <tr class="hover:bg-zinc-50/80 dark:hover:bg-zinc-900/30 transition-colors group"
                                            :class="currentLog && currentLog.id === log.id ? 'bg-zinc-50 dark:bg-zinc-900/50 border-r-4 border-zinc-900 dark:border-white' : 'border-r-4 border-transparent'">
                                            <td class="px-5 py-2.5 whitespace-nowrap text-zinc-500 font-mono text-[11px]" x-text="new Date(log.created_at).toLocaleTimeString('fa-IR', {hour12:false})"></td>
                                            <td class="px-5 py-2.5 whitespace-nowrap">
                                                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider"
                                                      :class="{'bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400': log.status === 'error',
                                                               'bg-yellow-100 text-yellow-600 dark:bg-yellow-900/30 dark:text-yellow-400': log.status === 'warning',
                                                               'bg-green-100 text-green-600 dark:bg-green-900/30 dark:text-green-400': log.status === 'success',
                                                               'bg-zinc-100 text-zinc-600 dark:bg-zinc-800 dark:text-zinc-300': log.status === 'info'}" 
                                                      x-text="log.status"></span>
                                            </td>
                                            <td class="px-5 py-2.5 whitespace-nowrap text-zinc-600 dark:text-zinc-400 font-mono text-[11px]" x-text="log.step_name || '-'"></td>
                                            <td class="px-5 py-2.5 text-zinc-800 dark:text-zinc-200">
                                                <span x-text="log.message"></span>
                                                <template x-if="log.screenshot_path">
                                                    <span class="inline-flex items-center gap-1 mr-3 text-[10px] bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400 px-1.5 py-0.5 rounded font-medium cursor-pointer"
                                                          @click="currentPhotoIndex = screenshotLogs.findIndex(s => s.id === log.id); document.getElementById('image-gallery-container').scrollIntoView({behavior: 'smooth'})">
                                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                                        مشاهده عکس
