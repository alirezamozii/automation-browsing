{% extends "base.html" %}

{% block title %}فرآیندهای اتوماسیون (Workflows){% endblock %}
{% block route %}workflows{% endblock %}

{% block content %}
<div class="space-y-6" x-data="{ 
    workflows: [], 
    search: '', 
    loading: true,
    dragover: false, 
    uploading: false, 
    uploadProgress: 0,
    get filteredWorkflows() {
        if (!this.search.trim()) return this.workflows;
        const q = this.search.toLowerCase();
        return this.workflows.filter(wf => 
            wf.name.toLowerCase().includes(q) || 
            (wf.description && wf.description.toLowerCase().includes(q))
        );
    },
    handleFileSelect(e) {
        const files = e.target.files || e.dataTransfer.files;
        if (files.length > 0) {
            this.uploadFile(files[0]);
        }
    },
    async uploadFile(file) {
        const ext = file.name.split('.').pop().toLowerCase();
        const allowed = ['py', 'js', 'ts', 'tsx', 'java'];
        if (!allowed.includes(ext)) {
            $store.globalStore.showToast('فرمت فایل نامعتبر است. فقط فایل‌های .py, .js, .ts, .tsx, .java مجاز هستند.', 'error');
            return;
        }
        
        this.uploading = true;
        this.uploadProgress = 10;
        const formData = new FormData();
        formData.append('file', file);
        
        try {
            this.uploadProgress = 30;
            const response = await fetch('/api/workflow/upload', {
                method: 'POST',
                body: formData
            });
            this.uploadProgress = 70;
            const result = await response.json();
            
            if (response.ok && result.success) {
                this.uploadProgress = 100;
                $store.globalStore.showToast(`اسکریپت '${file.name}' با موفقیت بارگذاری شد.`, 'success');
                // Refresh workflows
                const r = await fetch('/api/workflows');
                this.workflows = await r.json();
            } else {
                $store.globalStore.showToast(result.detail || 'خطا در بارگذاری فایل', 'error');
            }
        } catch (err) {
            console.error(err);
            $store.globalStore.showToast('خطا در برقراری ارتباط با سرور', 'error');
        } finally {
            setTimeout(() => {
                this.uploading = false;
                this.uploadProgress = 0;
            }, 500);
        }
    }
}" x-init="fetch('/api/workflows').then(r => r.json()).then(data => { workflows = data; loading = false; })">
    
    <!-- Drag & Drop Upload Zone (Persian, Premium Design) -->
    <div class="card p-6 border-dashed border-2 border-zinc-200 dark:border-zinc-800 transition-all relative overflow-hidden bg-transparent"
       :class="dragover ? 'border-zinc-500 dark:border-zinc-500 bg-zinc-50/50 dark:bg-zinc-900/10 scale-[1.002]' : ''"
       @dragover.prevent="dragover = true"
       @dragleave.prevent="dragover = false"
       @drop.prevent="dragover = false; handleFileSelect($event)">
        
        <input type="file" id="file-upload-input" accept=".py,.js,.ts,.tsx,.java" class="hidden" @change="handleFileSelect($event)">
        
        <label for="file-upload-input" class="cursor-pointer flex flex-col items-center justify-center space-y-3 py-4 w-full h-full">
            <!-- Icon -->
            <div class="w-12 h-12 rounded-full bg-zinc-50 dark:bg-zinc-900 border border-zinc-100 dark:border-zinc-800 flex items-center justify-center text-zinc-400 dark:text-zinc-600">
                <svg class="w-6 h-6 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
            </div>
            
            <!-- Description -->
            <div class="text-center select-none">
                <p class="text-sm font-semibold text-zinc-800 dark:text-zinc-200">فایل‌های اسکریپت خود را به اینجا بکشید یا برای بارگذاری کلیک کنید</p>
                <p class="text-xs text-zinc-400 dark:text-zinc-500 mt-1">فرمت‌های مجاز: Python (.py) - Javascript (.js) - Typescript (.ts, .tsx) - Java (.java)</p>
            </div>
        </label>
        
        <!-- Progress overlay -->
        <div x-show="uploading" class="absolute inset-0 bg-white/80 dark:bg-black/80 flex flex-col items-center justify-center space-y-2 z-10">
            <div class="w-64 bg-zinc-200 dark:bg-zinc-800 rounded-full h-1.5 overflow-hidden">
                <div class="bg-zinc-900 dark:bg-white h-full transition-all duration-300" :style="`width: ${uploadProgress}%`"></div>
            </div>
            <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400" x-text="`در حال آپلود و ثبت اسکریپت... ${uploadProgress}%`"></span>
        </div>
    </div>

    <!-- Dynamic Search Control -->
    <div class="flex items-center gap-3">
        <div class="relative w-full max-w-sm">
            <svg class="absolute right-3 top-2.5 h-4 w-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" x-model="search" placeholder="جستجوی فرآیند..." class="pl-3 pr-9 py-1.5 w-full border border-gray-200 dark:border-zinc-800 rounded bg-white dark:bg-zinc-950 focus:ring-1 focus:ring-zinc-400 focus:border-zinc-400 text-xs">
        </div>
    </div>

    <!-- Loading State -->
    <div x-show="loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="i in [1, 2, 3]">
            <div class="card p-5 h-36 skeleton-loading"></div>
        </template>
    </div>

    <!-- Empty State -->
    <div x-show="!loading && filteredWorkflows.length === 0" class="card p-12 text-center flex flex-col items-center justify-center max-w-lg mx-auto">
        <svg class="w-10 h-10 text-zinc-300 dark:text-zinc-700 mb-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0a2 2 0 01-2 2H6a2 2 0 01-2-2m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
        <h4 class="text-sm font-semibold text-zinc-700 dark:text-zinc-300 mb-1">هیچ فرآیند فعالی یافت نشد</h4>
        <p class="text-xs text-zinc-400 dark:text-zinc-500">در حال حاضر هیچ سناریوی اتوماسیونی در سیستم ثبت نشده است.</p>
    </div>

    <!-- Workflows Grid (Actual discovered workflows only) -->
    <div x-show="!loading && filteredWorkflows.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="wf in filteredWorkflows" :key="wf.name">
            <div class="card p-5 flex flex-col h-full justify-between hover:bg-zinc-50/50 dark:hover:bg-zinc-900/10 transition-colors">
                <div class="space-y-3">
                    <div class="flex justify-between items-start">
                        <div class="w-8 h-8 rounded bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 flex items-center justify-center shrink-0">
                            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        </div>
                        <span class="badge badge-success text-[10px] font-normal">آماده اجرا</span>
                    </div>
                    <div>
                        <h3 class="text-sm font-semibold text-zinc-900 dark:text-zinc-100" x-text="wf.name"></h3>
                        <p class="text-xs text-zinc-400 dark:text-zinc-500 mt-1 leading-normal" x-text="wf.description || 'توضیحات فرآیند ثبت نشده است.'"></p>
                    </div>
                </div>
                
                <div class="border-t border-gray-100 dark:border-zinc-800/40 pt-3 mt-4 flex justify-between items-center text-xs text-zinc-400 dark:text-zinc-500">
                    <span class="flex items-center gap-1 select-none">
                        <svg class="w-3.5 h-3.5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                        <span x-text="wf.steps_count || '0'"></span> مرحله
                    </span>
                    <a href="/" @click="localStorage.setItem('selectedWorkflowOnDashboard', wf.name)" class="text-zinc-800 dark:text-zinc-200 font-medium hover:underline flex items-center gap-1 select-none">
                        انتقال به اجرای داشبورد
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </a>
                </div>
            </div>
        </template>
    </div>
</div>
{% endblock %}
